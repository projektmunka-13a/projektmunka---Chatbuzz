<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 90 920 940" width="920" height="940" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#FBCFE8"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="1100">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#2E1065" flood-opacity="0.28"/>
    </filter>
    <filter id="shadowS" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2E1065" flood-opacity="0.25"/>
    </filter>
    <clipPath id="phoneClip"><rect x="300" y="130" width="400" height="840" rx="64"/></clipPath>
    <clipPath id="imgClip"><rect x="330" y="290" width="340" height="320" rx="28"/></clipPath>
    <path id="heart" d="M0 22 C-52 -18 -34 -58 0 -32 C34 -58 52 -18 0 22 Z"/>
  </defs>


  <!-- Telefon -->
  <g filter="url(#shadow)">
    <rect x="300" y="130" width="400" height="840" rx="64" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="3"/>
  </g>
  <g clip-path="url(#phoneClip)">
    <rect x="450" y="152" width="100" height="18" rx="9" fill="#EDE9FE"/>

    <!-- Poszt 1 -->
    <circle cx="364" cy="236" r="28" fill="url(#ink)"/>
    <rect x="410" y="222" width="140" height="14" rx="7" fill="#DDD6FE"/>
    <rect x="410" y="246" width="90" height="10" rx="5" fill="#EDE9FE"/>

    <rect x="330" y="290" width="340" height="320" rx="28" fill="url(#soft)"/>
    <g clip-path="url(#imgClip)">
      <circle cx="590" cy="374" r="38" fill="#FFFFFF" opacity="0.85"/>
      <path d="M330 610 V520 L430 428 L520 528 L585 470 L670 556 V610 Z" fill="#C4B5FD" opacity="0.75"/>
      <path d="M330 610 V570 L410 500 L500 590 L560 540 L670 610 Z" fill="#F9A8D4" opacity="0.85"/>
    </g>

    <!-- Akció ikonok -->
    <use href="#heart" transform="translate(362 656) scale(0.42)" fill="#EC4899"/>
    <rect x="404" y="638" width="34" height="30" rx="15" fill="none" stroke="#7C3AED" stroke-width="5"/>
    <path d="M470 640 L504 654 L470 668 L478 654 Z" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linejoin="round"/>

    <rect x="330" y="696" width="300" height="12" rx="6" fill="#DDD6FE"/>
    <rect x="330" y="720" width="210" height="12" rx="6" fill="#EDE9FE"/>

    <!-- Poszt 2 (levágva) -->
    <circle cx="364" cy="806" r="28" fill="#F9A8D4"/>
    <rect x="410" y="792" width="120" height="14" rx="7" fill="#DDD6FE"/>
    <rect x="410" y="816" width="80" height="10" rx="5" fill="#EDE9FE"/>
    <rect x="330" y="860" width="340" height="200" rx="28" fill="url(#soft)"/>
  </g>

  <!-- Lebegő chatbuborék: gépel... -->
  <g filter="url(#shadowS)">
    <rect x="80" y="330" width="290" height="120" rx="60" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="3"/>
    <polygon points="140,436 116,490 190,448" fill="#FFFFFF"/>
  </g>
  <circle cx="170" cy="390" r="16" fill="#7C3AED"/>
  <circle cx="225" cy="390" r="16" fill="#A855F7"/>
  <circle cx="280" cy="390" r="16" fill="#EC4899"/>

  <!-- Lebegő üzenet jobbra -->
  <g filter="url(#shadowS)">
    <rect x="630" y="560" width="290" height="116" rx="58" fill="#2E1065"/>
    <polygon points="860,664 888,716 810,672" fill="#2E1065"/>
  </g>
  <rect x="676" y="596" width="190" height="14" rx="7" fill="#FFFFFF" opacity="0.9"/>
  <rect x="676" y="624" width="130" height="14" rx="7" fill="#FFFFFF" opacity="0.5"/>

  <!-- Like jelvény -->
  <g filter="url(#shadowS)">
    <circle cx="790" cy="250" r="68" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="3"/>
  </g>
  <use href="#heart" transform="translate(790 252) scale(1.05)" fill="#EC4899"/>

  <!-- Barát jelvény -->
  <g filter="url(#shadowS)">
    <rect x="70" y="640" width="250" height="100" rx="50" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="3"/>
  </g>
  <circle cx="122" cy="690" r="28" fill="url(#ink)"/>
  <circle cx="122" cy="682" r="9" fill="#FFFFFF"/>
  <path d="M104 704 Q122 686 140 704 Z" fill="#FFFFFF"/>
  <rect x="166" y="672" width="100" height="12" rx="6" fill="#DDD6FE"/>
  <rect x="166" y="696" width="64" height="10" rx="5" fill="#EDE9FE"/>
  <circle cx="288" cy="690" r="16" fill="#EC4899"/>
  <path d="M288 682 V698 M280 690 H296" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <!-- Villám jelvény -->
  <g filter="url(#shadowS)">
    <circle cx="840" cy="850" r="64" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="3"/>
  </g>
  <polygon points="852,812 812,858 836,858 826,890 870,840 846,840" fill="url(#ink)" stroke="url(#ink)" stroke-width="8" stroke-linejoin="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
